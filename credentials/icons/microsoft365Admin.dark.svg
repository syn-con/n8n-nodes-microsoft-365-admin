<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Microsoft 365">
	<!-- Dark-canvas variant: the same four-square mark with each fill lifted in lightness,
	     which keeps the perceived contrast of the light-canvas icon on a dark background. -->
	<rect x="1" y="1" width="10" height="10" fill="#FF6B45"/>
	<rect x="13" y="1" width="10" height="10" fill="#9BD119"/>
	<rect x="1" y="13" width="10" height="10" fill="#38BDFF"/>
	<rect x="13" y="13" width="10" height="10" fill="#FFC933"/>
</svg>
